%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/maxim,max17201.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX17201 fuel gauge

maintainers:
  - Dimitri Fedrau <dima.fedrau@gmail.com>

allOf:
  - $ref: power-supply.yaml#
  - if:
      properties:
        compatible:
          const: maxim,max77759
    then:
      properties:
        reg:
          maxItems: 1
      required:
        - maxim,rsense-micro-ohms
    else:
      required:
        - reg-names

properties:
  compatible:
    oneOf:
      - const: maxim,max17201
      - items:
          - enum:
              - maxim,max17205
          - const: maxim,max17201
      - const: maxim,max77759

  reg:
    items:
      - description: ModelGauge m5 registers
      - description: Nonvolatile registers

  reg-names:
    items:
      - const: m5
      - const: nvmem

  interrupts:
    maxItems: 1

  maxim,rsense-micro-ohms:
    description:
      Sense resistor value in micro-ohms. Only meaningful on devices
      without I2C-reachable nonvolatile memory (like the MAX77759), where
      the calibrated value cannot be read from the gauge.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      fuel-gauge@36 {
        compatible = "maxim,max17201";
        reg = <0x36>, <0xb>;
        reg-names = "m5", "nvmem";
        interrupt-parent = <&gpio0>;
        interrupts = <31 IRQ_TYPE_LEVEL_LOW>;
      };

      fuel-gauge@36 {
        compatible = "maxim,max77759";
        reg = <0x36>;
        maxim,rsense-micro-ohms = <5000>;
      };
    };