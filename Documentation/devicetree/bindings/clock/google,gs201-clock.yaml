%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/google,gs201-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google GS201 clock controllers

maintainers:
  - Theo Paris <theo@theoparis.com>

description: |
  Google GS201 has separate clock management units (CMUs). CMU_TOP
  generates clocks for the other CMUs using PLLs, multiplexers, dividers,
  and gates. Its external reference clock is supplied by the board; on
  Pixel 7a this is 24.576 MHz.

  CMU_TOP also has an alternative boost input from CMU_APM. The boost
  input may be specified when that provider is available. Without it,
  boost multiplexers must remain on their CMU_TOP-derived inputs.

  CMU_MISC supplies system peripherals, including the watchdogs and MCT.
  CMU_PERIC0 and CMU_PERIC1 supply connectivity peripherals such as USI
  and I3C controllers. CMU_HSI0 supplies USB and DisplayPort PHY clocks.
  These CMUs use the external reference and clocks generated by CMU_TOP.

  Clock identifiers are defined in dt-bindings/clock/google,gs201.h.
  CMU_HSI2 supplies the UFS, PCIe and MMC interfaces. CMU_DPU supplies the
  display frontend including DPP; CMU_DISP supplies the DECON backend.
  These three CMUs have switchable power domains. Their clock providers
  require the associated domain to be powered before register access.
  CMU_HSI0 also has a switchable power domain with the same requirement.
  Its USB reference path is derived from the HSI0 USB PLL and divider;
  alternate, PHY-output and TCXO inputs remain unverified.

  CMU_APM is not described yet.

properties:
  compatible:
    enum:
      - google,gs201-cmu-top
      - google,gs201-cmu-misc
      - google,gs201-cmu-peric0
      - google,gs201-cmu-peric1
      - google,gs201-cmu-hsi2
      - google,gs201-cmu-dpu
      - google,gs201-cmu-disp
      - google,gs201-cmu-hsi0

  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    minItems: 1
    maxItems: 5

  clock-names:
    minItems: 1
    maxItems: 5

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - "#clock-cells"
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        compatible:
          const: google,gs201-cmu-top
    then:
      properties:
        clocks:
          minItems: 1
          items:
            - description: External reference clock
            - description: Alternative boost clock from CMU_APM
        clock-names:
          minItems: 1
          items:
            - const: oscclk
            - const: boost

  - if:
      properties:
        compatible:
          const: google,gs201-cmu-misc
    then:
      properties:
        clocks:
          items:
            - description: External reference clock
            - description: MISC NoC bus clock from CMU_TOP
            - description: MISC security subsystem clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: sss

  - if:
      properties:
        compatible:
          enum:
            - google,gs201-cmu-peric0
            - google,gs201-cmu-peric1
    then:
      properties:
        clocks:
          items:
            - description: External reference clock
            - description: PERIC NoC bus clock from CMU_TOP
            - description: PERIC IP clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ip

  - if:
      properties:
        compatible:
          const: google,gs201-cmu-hsi2
    then:
      properties:
        clocks:
          items:
            - description: External reference clock
            - description: HSI2 NoC bus clock from CMU_TOP
            - description: HSI2 PCIe clock from CMU_TOP
            - description: HSI2 UFS clock from CMU_TOP
            - description: HSI2 MMC clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: pcie
            - const: ufs
            - const: mmc

  - if:
      properties:
        compatible:
          const: google,gs201-cmu-hsi0
    then:
      properties:
        clocks:
          items:
            - description: External reference clock
            - description: HSI0 NoC bus clock from CMU_TOP
            - description: HSI0 DisplayPort TC clock from CMU_TOP
            - description: HSI0 USB DRD clock from CMU_TOP
            - description: HSI0 USBDP debug clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: dpgtc
            - const: usb31drd
            - const: usbdpdbg

  - if:
      properties:
        compatible:
          enum:
            - google,gs201-cmu-dpu
            - google,gs201-cmu-disp
    then:
      properties:
        clocks:
          items:
            - description: External reference clock
            - description: Display NoC bus clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus

  - if:
      properties:
        compatible:
          not:
            enum:
              - google,gs201-cmu-hsi2
              - google,gs201-cmu-dpu
              - google,gs201-cmu-disp
              - google,gs201-cmu-hsi0
    then:
      properties:
        power-domains: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,gs201.h>

    cmu_top: clock-controller@1e080000 {
        compatible = "google,gs201-cmu-top";
        reg = <0x1e080000 0x8000>;
        #clock-cells = <1>;
        clocks = <&ext_24_5m>;
        clock-names = "oscclk";
    };

    cmu_peric0: clock-controller@10800000 {
        compatible = "google,gs201-cmu-peric0";
        reg = <0x10800000 0x8000>;
        #clock-cells = <1>;
        clocks = <&ext_24_5m>,
                 <&cmu_top CLK_GOUT_CMU_PERIC0_NOC>,
                 <&cmu_top CLK_GOUT_CMU_PERIC0_IP>;
        clock-names = "oscclk", "bus", "ip";
    };
...
