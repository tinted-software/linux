%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpg12-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG12 Power Management IC regulators

maintainers:
  - Theo Paris <theo@theoparis.com>

description: |
  This is part of the device tree bindings for the S2MPG12 Power Management IC
  (PMIC).

  The S2MPG12 PMIC provides 10 buck and 28 LDO regulators.

  The regulators are identified by the name of their node, e.g. buck1m or
  ldo28m. The corresponding regulator IDs are available as preprocessor macros
  in dt-bindings/regulator/samsung,s2mpg12-regulator.h.

  See also Documentation/devicetree/bindings/mfd/samsung,s2mpg12-pmic.yaml for
  additional information and example.

patternProperties:
  # 10 bucks
  "^buck([1-9]|10)m$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    description:
      Properties for a single buck regulator.

  # 28 LDOs
  "^ldo([1-9]|1[0-9]|2[0-8])m$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    description:
      Properties for a single LDO regulator.

additionalProperties: false
