%YAML 1.2
---
$id: http://devicetree.org/schemas/display/google,gs201-dsim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google GS201 MIPI DSI host

maintainers:
  - Theo Paris <theo@theoparis.com>

description: |
  Samsung DSIM based MIPI DSI host of the Google Tensor G2 (GS201). It sits
  in the DISP block next to the DECON and shares the DISP backend clock.

allOf:
  - $ref: /schemas/display/dsi-controller.yaml#

properties:
  compatible:
    const: google,gs201-dsim

  reg:
    maxItems: 1

  clocks:
    items:
      - description: DISP backend bus clock

  clock-names:
    items:
      - const: bus

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input from the DECON.

    required:
      - port@0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - ports

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,gs201.h>

    dsi@1c2c0000 {
        compatible = "google,gs201-dsim";
        reg = <0x1c2c0000 0x300>;
        clocks = <&cmu_disp CLK_GOUT_DISP_DPUB_ACLK_DECON>;
        clock-names = "bus";
        #address-cells = <1>;
        #size-cells = <0>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                dsim0_in: endpoint {
                    remote-endpoint = <&dpu_out>;
                };
            };
        };

        panel@0 {
            compatible = "samsung,s6e3fc5";
            reg = <0>;
        };
    };
